name: "AI Jobs Hub v2 — Direct Discovery (Staging)"

on:
  schedule:
    # Every 4 hours at minute 17 UTC to avoid GitHub Actions :00 queue spikes.
    # 00:17 UTC = 07:17 WIB (Asia/Jakarta), completing ahead of the 08:00 WIB daily digest.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      boolean_eligible:
        description: "Emit boolean 'eligible' instead of string classification"
        required: false
        default: "false"
        type: boolean
  push:
    branches:
      - "feat/v2-direct-discovery"
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "collect_jobs.py"
      - "requirements.txt"
      - ".github/workflows/collect_v2_staging.yml"

permissions:
  contents: write

concurrency:
  group: ai-jobs-v2-staging-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-collect-validate:
    if: github.ref == 'refs/heads/feat/v2-direct-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate 1 — Run automated regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v --tb=short

      - name: Gate 2 — Execute multi-source direct job collectors (Staging)
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.boolean_eligible }}" = "true" ]; then
            EXTRA_FLAGS="--boolean-eligible"
          fi
          python collect_jobs.py --mode staging $EXTRA_FLAGS

      - name: Gate 3 — Validate staging feed Android schema compatibility
        run: |
          python collect_jobs.py --validate-only staging/jobs_feed.json

      - name: Gate 4 — Validate isolated freshness-first catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("staging/freshness_catalog.json")
          assert path.is_file(), "Freshness catalog missing after collection"
          catalog = json.loads(path.read_text(encoding="utf-8"))
          assert catalog.get("experimentalOnly") is True
          assert catalog.get("doNotPromoteToAndroidFeed") is True
          jobs = catalog["jobs"]
          assert catalog["totalJobs"] == len(jobs)
          grouping = catalog["projectGrouping"]
          grouped = [i for g in grouping["groups"] for i in g["listingIds"]]
          assert len(grouped) == len(set(grouped)) == len(jobs)
          assert set(grouped) == {j["id"] for j in jobs}
          assert all(j.get("applyUrl") for j in jobs)
          assert grouping["totalContentGroups"] == len(grouping["groups"])
          print("CONTENT_GROUPS:", grouping["totalContentGroups"], "REPORTED_7D:", grouping["contentGroupsReported7d"], "MULTI:", grouping["multiListingGroups"])
          ids = [j["id"] for j in jobs]
          assert len(ids) == len(set(ids)), "Duplicate catalog IDs"
          assert all(j.get("eligibilityClass") in (
              "Indonesia Eligible", "Remote Global", "Restricted", "Unverified"
          ) for j in jobs), "Invalid eligibility class"
          dated = [j for j in jobs if j.get("officialPostedDate")]
          dates = [datetime.fromisoformat(j["officialPostedDate"].replace("Z", "+00:00")) for j in dated]
          assert dates == sorted(dates, reverse=True), "Dated jobs not newest first"
          assert all(j.get("officialPostedDate") for j in jobs[:len(dated)]), "Undated jobs above dated jobs"
          syndicated = [j for j in jobs if j.get("sourceConnector") == "syndicated_aitrainer"]
          assert all(j["isDirect"] is False and not j["officialPostedDate"] and not j["date"] and j["eligibilityClass"] == "Unverified" and j["applyUrl"].startswith("https://aitrainer.work/") and "AITrainer.work" in j["excerpt"] for j in syndicated)
          print("SYNDICATED:", len(syndicated))
          ot = [j for j in jobs if j.get("sourceConnector") == "syndicated_opentrain"]
          assert all(j["isDirect"] is False and not j["officialPostedDate"] and not j["date"] and j["eligibilityClass"] == "Unverified" and j["applyUrl"].startswith("https://app.opentrain.ai/") and "Via OpenTrain" in j["excerpt"] for j in ot)
          print("OPENTRAIN:", len(ot))
          from collections import Counter
          now = datetime.now(timezone.utc)
          recent = [j for j in jobs if j.get("officialPostedDate") and 0 <= (now - datetime.fromisoformat(j["officialPostedDate"].replace("Z", "+00:00"))).total_seconds() <= 7 * 86400]
          geography = Counter(j.get("eligibilityClass", "Unspecified") for j in jobs)
          print(f"Freshness catalog validated: {len(jobs)} jobs, {len(dated)} dated; {len(recent)} posted in <=7d")
          print("Geographic classification:", dict(geography))
          for item in jobs[:8]:
              print("TOP_POSTED:", item.get("officialPostedDate") or "undated", "|", item.get("company"), "|", item.get("title"), "|", item.get("eligibilityClass"))
          PY

      - name: Publish Source Coverage Report to Step Summary
        if: always()
        run: |
          if [ -f state/COVERAGE_REPORT.md ]; then
            cat state/COVERAGE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging feed, persistent state, and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-jobs-v2-staging-artifacts-${{ github.run_number }}
          path: |
            staging/jobs_feed.json
            staging/freshness_catalog.json
            staging/discovery_history.json
            state/coverage_report.json
            state/COVERAGE_REPORT.md
            state/unverified_jobs.json
            state/daily_new_candidates.json
            state/job_history.json
            state/aitrainer_snapshot.json
            state/opentrain_snapshot.json
          retention-days: 14

      - name: Commit updated staging feed & persistent job history (Protected Branch Guard)
        run: |
          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          if [ "$CURRENT_BRANCH" = "main" ] || [ "$CURRENT_BRANCH" = "master" ]; then
            echo "SAFETY GUARD: Refusing to overwrite main branch from staging workflow."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/aitrainer_snapshot.json ]; then git add state/aitrainer_snapshot.json; fi
          if [ -f state/opentrain_snapshot.json ]; then git add state/opentrain_snapshot.json; fi
          git add staging/jobs_feed.json staging/freshness_catalog.json staging/discovery_history.json state/job_history.json state/http_cache.json state/unverified_jobs.json state/daily_new_candidates.json state/coverage_report.json state/COVERAGE_REPORT.md
          if git diff --cached --quiet; then
            echo "No changes in staging feed or state."
          else
            git commit -m "chore(v2-staging): sync direct AI job sources & history [skip ci]"
            git pull --rebase -X theirs origin "$CURRENT_BRANCH"
            git push origin "HEAD:$CURRENT_BRANCH"
          fi
