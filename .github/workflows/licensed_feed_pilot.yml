name: Licensed Feed Pilot (Isolated)
on:
  push:
    branches: ["feat/v2-direct-discovery"]
    paths: ["pilot_licensed/**", ".github/workflows/licensed_feed_pilot.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    if: github.ref == 'refs/heads/feat/v2-direct-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src:pilot_licensed python -m pytest tests/ pilot_licensed/ -q
      - run: PYTHONPATH=src python pilot_licensed/aitrainer_live.py
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-feed-pilot
          path: aitrainer-live-report.json
          if-no-files-found: error
