name: AI Jobs Hub v2.2 — Three Source Discovery Research (Staging)

on:
  workflow_dispatch:
  push:
    branches: [feat/v2-direct-discovery]
    paths:
      - research_third_party_sources.py
      - config/third_party_discovery_research.json
      - tests/test_third_party_discovery_research.py
      - .github/workflows/third_party_research_staging.yml

permissions:
  contents: write

concurrency:
  group: third-party-research-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Gate 1 — Full regression suite
        env:
          PYTHONPATH: src:.
        run: pytest tests/ -q --tb=short
      - name: Protect existing staging and production feeds
        run: sha256sum jobs_feed.json staging/jobs_feed.json state/job_history.json > "$RUNNER_TEMP/protected.sha256"
      - name: Gate 2 — Bounded research scan (RemoWork excluded from automation)
        run: python research_third_party_sources.py
      - name: Gate 3 — Validate research only
        run: |
          sha256sum -c "$RUNNER_TEMP/protected.sha256"
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('staging/third_party_discovery_research.json').read_text())
          assert j['experimentalOnly'] and j['doNotPublishToAndroid']
          assert len(j['sources']) == 3
          assert j['sources'][0]['state'] == 'MANUAL_REVIEW_REQUIRED'
          assert all(not s['reusePermissionVerified'] and not s['postedDatesVerified'] for s in j['sources'])
          for x in j['sources']:
              print(x['name'],x['state'],x['internalCandidateLinks'],x['outboundHostCount'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-party-research-${{ github.run_number }}
          path: staging/third_party_discovery_research.json
          retention-days: 14
      - name: Sync research output only
        run: |
          test "$GITHUB_REF_NAME" = "feat/v2-direct-discovery"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/third_party_discovery_research.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(discovery): sync bounded source research [skip ci]"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
